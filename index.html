<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQUA CANA - Country and Residence</title>


    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 [INICIO DE ESTILOS CSS] */

        /* Variables de Color - Paleta Jade Real */
        :root {
            --color-jade-vibrant: #00A86B;
            --color-jade-dark: #007850;
            --color-jade-medium: #00C77F;
            --color-jade-light: #4DE38F;
            --color-jade-bg: #A8E6CF;
            --color-jade-accent: #2ECC71;
            --color-white: #FFFFFF;
            --color-black: #1a1a1a;
            --color-gray-light: #f5f5f5;
            --color-gray-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            margin: 0;
            background-color: var(--color-gray-light);
        }

        .landing-container {
            width: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--color-black);
            line-height: 1.6;
        }

        /* Scroll Hint */
        .scroll-hint-bottom {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            pointer-events: none;
            animation: bounce 2s infinite;
            color: white;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-20px);
            }
            60% {
                transform: translateX(-50%) translateY(-10px);
            }
        }
        .scroll-hint-bottom-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
        }
        .scroll-hint-bottom-text {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Typography */
        .section-title {
            font-size: clamp(2.25rem, 5vw, 3.75rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            line-height: 1.1;
            color: var(--color-gray-dark);
        }

        .section-subtitle {
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 3.5rem;
            color: #6b7280; /* gray-500 */
        }

        .brand-subtle {
            font-size: 0.875rem;
            font-weight: 600;
            color: #6b7280; /* gray-500 */
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Sections */
        .section {
            padding: 5rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .section-white {
            background-color: var(--color-white);
        }

        .section-slate {
            background-color: #f8fafc; /* slate-50 */
        }

        /* Sección Solares en Preventa */
        .solares-preventa-section {
            position: relative;
            background-color: #002e2e;
            color: var(--color-white);
            padding: 5rem 0;
        }

        .solares-marquee-wrapper {
            background: transparent;
            padding: 0.75rem 0;
            overflow: hidden;
            position: relative;
            margin-bottom: 3rem;
        }

        .solares-marquee {
            display: flex;
            white-space: nowrap;
            animation: marqueeScroll 20s linear infinite;
        }

        .marquee-text {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #c3a177; /* gold color from original */
            text-transform: uppercase;
            padding: 0 2rem;
        }

        @keyframes marqueeScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .solares-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .solares-header .brand-subtle {
            color: rgba(255,255,255,0.7);
        }
        .solares-header h2 {
            font-size: clamp(2.5rem, 5.5vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--color-white);
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .solares-header p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
        }

        .solares-grid {
            display: grid;
            gap: 3rem;
            align-items: center;
        }
        @media (min-width: 1024px) {
            .solares-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .solares-image-col .image-wrapper {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .solares-image-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .solares-image-col .image-badge {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: rgba(217, 4, 4, 0.8);
            backdrop-filter: blur(5px);
            color: var(--color-white);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .solares-info-col {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            text-align: left;
        }

        .solares-financiamiento {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .solares-financiamiento-icon {
            background-color: #c3a177;
            padding: 1rem;
            border-radius: 50%;
            color: #002e2e;
            flex-shrink: 0;
        }
        .solares-financiamiento-text h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .solares-financiamiento-text p {
            color: rgba(255,255,255,0.8);
        }

        .solares-features-list {
            list-style: none;
            padding-left: 0;
        }
        .solares-features-list li {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .solares-features-list .icon {
            color: #c3a177;
            margin-top: 0.25rem;
            flex-shrink: 0;
        }
        .solares-features-list strong {
            display: block;
            font-size: 1.125rem;
        }
        .solares-features-list span {
            color: rgba(255,255,255,0.8);
        }

        .solares-cta-box {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .solares-cta-box .btn {
            width: 100%;
        }
        .solares-cta-box p {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: rgba(255,255,255,0.7);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            font-weight: 700;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transform: scale(1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-primary {
            color: var(--color-white);
            background: #008A8A; /* Teal color from original */
        }
        .btn-primary:hover {
            background: #006f6f;
        }

        .btn-accent {
            color: #002e2e;
            background: #c3a177;
        }
        .btn-accent:hover {
            background: #d4b89a;
        }

        .btn-lg {
            padding: 1rem 2rem;
            font-size: 1.125rem;
        }

        /* Forms */
        .form-control {
            display: block;
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--color-gray-dark);
            background-color: rgba(255, 255, 255, 0.9);
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            color: var(--color-gray-dark);
            background-color: #fff;
            border-color: var(--color-jade-vibrant);
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(0, 168, 107, 0.25);
        }

        .form-label {
            display: inline-block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-white);
            overflow: hidden;
            text-align: center;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            animation: fadeInFromBottom 1s ease-out;
        }
        @keyframes fadeInFromBottom {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .hero-logo-icon {
            width: 7rem;
            height: 7rem;
            object-fit: contain;
        }
        .hero-brand {
            background-color: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .hero-brand-text {
            color: var(--color-white);
            font-weight: 800;
        }
        .hero-brand-text .line1 {
            display: block;
            font-size: 2.25rem;
            letter-spacing: 0.2em;
        }
        .hero-brand-text .line2 {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
        }
        .hero-main-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            line-height: 1;
        }
        .hero-subtitle-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (min-width: 768px) {
            .hero-subtitle-group {
                flex-direction: row;
                gap: 2rem;
            }
        }
        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .hero-tag {
            background-color: #e7759c;
            color: var(--color-white);
            font-size: 0.875rem;
            font-weight: 700;
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .hero-cta-button {
            margin-top: 3rem;
        }

        /* Confirmation Overlay */
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .overlay-content {
            background: var(--color-white);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            animation: fadeInZoom 0.3s ease-out;
        }
        @keyframes fadeInZoom {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .overlay-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--color-gray-dark);
            opacity: 0.6;
            padding: 0;
            line-height: 1;
        }
        .overlay-close-btn:hover {
            opacity: 1;
        }
        .overlay-brand-logo {
            margin: 0 auto 1.5rem auto;
            background-color: var(--color-jade-bg);
            padding: 0.75rem;
            display: inline-block;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 168, 107, 0.2);
        }
        .overlay-brand-logo-text {
            color: var(--color-jade-dark);
            font-weight: 800;
            letter-spacing: 0.2em;
        }
        .overlay-brand-logo-text .line1 {
            display: block;
            font-size: 1.25rem;
        }
        .overlay-brand-logo-text .line2 {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
        }
        .overlay-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-gray-dark);
            margin-bottom: 1rem;
        }
        .overlay-message {
            font-size: 1.125rem;
            color: var(--color-gray-dark);
            opacity: 0.8;
        }

        /* Villas & Amenities Sliders */
        .slider-container {
            position: relative;
        }
        .slider-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 3.5rem;
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-gray-dark);
        }
        .slider-nav-btn:hover {
            background-color: var(--color-white);
            transform: translateY(-50%) scale(1.1);
        }
        .slider-nav-btn.prev {
            left: -1.5rem;
        }
        .slider-nav-btn.next {
            right: -1.5rem;
        }
        @media (max-width: 1024px) {
            .slider-nav-btn.prev { left: 0.5rem; }
            .slider-nav-btn.next { right: 0.5rem; }
        }
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .slider-dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            background-color: #d1d5db; /* gray-300 */
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }
        .slider-dot.active {
            background-color: #008A8A;
            width: 2rem;
        }
        /* Villas Specific */
        .villas-card {
            background-color: #f8fafc; /* slate-50 */
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            overflow: hidden;
        }
        .villas-grid {
            display: grid;
            gap: 2rem;
            align-items: flex-start;
        }
        @media (min-width: 1024px) {
            .villas-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        .villa-gallery-main-img-wrapper {
            position: relative;
        }
        .villa-gallery-main-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .villa-gallery-counter {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }
        .villa-gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .villa-thumbnail {
            aspect-ratio: 1/1;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            opacity: 0.7;
            transition: all 0.2s ease;
            position: relative;
            background: transparent;
            padding: 0;
        }
        .villa-thumbnail:hover {
            opacity: 1;
        }
        .villa-thumbnail.active {
            border-color: #008A8A;
            opacity: 1;
        }
        .villa-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .villa-thumbnail .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.2);
        }
        .villa-details {
            display: flex;
            flex-direction: column;
            height: 100%;
            text-align: left;
        }
        .villa-details h3 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--color-gray-dark);
        }
        .villa-details .subtitle {
            color: #4b5563; /* gray-600 */
        }
        .villa-price {
            margin: 1rem 0 1.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: #008A8A;
            background-color: #e0f2f1;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            align-self: flex-start;
        }
        .villa-specs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            color: #374151; /* gray-700 */
        }
        .spec-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .spec-item svg {
            color: #008A8A;
        }
        .spec-item-text .value {
            font-weight: 700;
            font-size: 1.125rem;
        }
        .villa-features-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
        }
        .villa-features-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #4b5563; /* gray-600 */
            margin-bottom: 0.5rem;
        }
        .villa-features-list svg {
            color: #22c55e; /* green-500 */
        }
        .villa-cta-button {
            width: 100%;
            margin-top: auto; /* Pushes button to bottom */
        }

        /* Amenities Specific */
        .amenities-card {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .amenities-card-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .amenities-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
        }
        .amenities-card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 2.5rem;
            color: var(--color-white);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-align: left;
        }
        .amenities-card-content h3 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .amenities-card-content p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            max-width: 60ch;
        }
        /* Contact Section */
        .contact-section {
            background-size: cover;
            background-position: center;
            padding: 5rem 0;
        }
        .contact-card {
            max-width: 650px;
            margin: 0 auto;
            background-color: rgba(0, 46, 46, 0.9);
            backdrop-filter: blur(8px);
            color: var(--color-white);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .contact-card-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .contact-card-header .brand {
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #c3a177; /* hardcoded from original */
            margin-bottom: 0.5rem;
        }
        .contact-card-header h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
        }
        .contact-card-header p {
            font-size: 1.25rem;
            margin-top: 0.5rem;
            opacity: 0.8;
        }
        .contact-form .phone-input-group {
            display: flex;
            gap: 0.5rem;
        }
        .contact-form .phone-input-group .country-code {
            flex: 0 0 120px;
        }
        .contact-form .phone-input-group .phone-number {
            flex: 1 1 auto;
        }
        .contact-form .submit-btn {
            width: 100%;
        }
        .contact-form .disclaimer {
            text-align: center;
            font-size: 0.875rem;
